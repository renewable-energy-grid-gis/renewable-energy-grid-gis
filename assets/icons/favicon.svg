<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-label="Renewable Energy and Grid GIS Automation">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F4A261"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8D8EA"/>
      <stop offset="1" stop-color="#5BA8C8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BC47F"/>
      <stop offset="1" stop-color="#3D8B5F"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#345B8B"/>
      <stop offset="1" stop-color="#1F3A60"/>
    </linearGradient>
  </defs>

  <!-- Mark: square 160x160 -->
  <g transform="translate(8,8)">
    <!-- background tile -->
    <rect x="0" y="0" width="144" height="144" rx="22" fill="#F4F8FB"/>
    <!-- sun core + rays -->
    <g transform="translate(72,58)">
      <circle r="18" fill="url(#sun)"/>
      <g stroke="url(#sun)" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-30" x2="0" y2="-40"/>
        <line x1="0" y1="30" x2="0" y2="40"/>
        <line x1="-30" y1="0" x2="-40" y2="0"/>
        <line x1="30" y1="0" x2="40" y2="0"/>
        <line x1="-21" y1="-21" x2="-28" y2="-28"/>
        <line x1="21" y1="-21" x2="28" y2="-28"/>
        <line x1="-21" y1="21" x2="-28" y2="28"/>
        <line x1="21" y1="21" x2="28" y2="28"/>
      </g>
    </g>
    <!-- wind turbine -->
    <g transform="translate(40,100)">
      <rect x="-2.5" y="-30" width="5" height="32" rx="2" fill="url(#grid)"/>
      <g transform="translate(0,-30)">
        <path d="M0 0 C 6 -18 18 -22 24 -16 L 4 -2 Z" fill="url(#leaf)"/>
        <path d="M0 0 C -6 -18 -18 -22 -24 -16 L -4 -2 Z" fill="url(#leaf)" transform="rotate(120)"/>
        <path d="M0 0 C -6 -18 -18 -22 -24 -16 L -4 -2 Z" fill="url(#leaf)" transform="rotate(240)"/>
        <circle r="3.5" fill="#1F3A60"/>
      </g>
    </g>
    <!-- transmission tower / grid lines -->
    <g transform="translate(110,100)" stroke="url(#grid)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-10 0 L0 -32 L10 0 Z"/>
      <line x1="-12" y1="-10" x2="12" y2="-10"/>
      <line x1="-8" y1="-22" x2="8" y2="-22"/>
    </g>
    <!-- ground baseline -->
    <line x1="14" y1="118" x2="130" y2="118" stroke="#C8D7E2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(176,60)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#1F3A60">Renewable Energy</text>
    <text x="0" y="28" font-size="22" font-weight="700" fill="#3D8B5F">&amp; Grid GIS</text>
    <text x="0" y="56" font-size="14" font-weight="500" fill="#5C6D7C" letter-spacing="0.05em">PYTHON · AUTOMATION · GEOSPATIAL</text>
  </g>
</svg>
